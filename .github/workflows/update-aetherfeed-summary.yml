name: Update AetherFeed Summary

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: '次回実行までの待機秒数（通常は21400）'
        required: false
        default: '21400'
        type: string

concurrency:
  # 手動起動で二重ループを作らない。
  group: xiv-aetherfeed-summary-loop
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

env:
  DISCOVERY_FILE: aetherfeed-summary.json

jobs:
  update:
    name: Update AetherFeed summary (PowerShell)
    concurrency:
      # Repository Summary側の更新と生成物へのpushだけを直列化する。
      group: xiv-repository-json
      cancel-in-progress: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare previous summary (PowerShell)
        run: |
          if (Test-Path "${{ env.DISCOVERY_FILE }}") {
            Copy-Item "${{ env.DISCOVERY_FILE }}" previous-aetherfeed-summary.json -Force
          } else {
            '[]' | Set-Content previous-aetherfeed-summary.json -Encoding UTF8
          }
        shell: pwsh

      - name: Generate AetherFeed summary with distribution URLs (PowerShell)
        run: |
          .\.github\scripts\Update-AetherFeedSummary.ps1 `
            -OutputPath "dist/${{ env.DISCOVERY_FILE }}" `
            -PreviousPath previous-aetherfeed-summary.json `
            -ChangesPath dist/aetherfeed-summary-changes.json
        shell: pwsh

      - name: Report detected changes
        run: |
          $changes = Get-Content dist/aetherfeed-summary-changes.json -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "## AetherFeed まとめの差分"
          Add-Content $env:GITHUB_STEP_SUMMARY "- リポジトリグループ: $($changes.SourceCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- エントリ: $($changes.EntryCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 公式リポジトリとの重複除外: $($changes.ExcludedOfficialEntryCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 版の補正: $($changes.NormalizedVersionEntryCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 配布元マニフェスト取得: $($changes.SourceManifestFetchCount) 件 / 失敗 $($changes.SourceManifestFailureCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 配布URL取得済み: $($changes.DistributionUrlResolvedEntryCount) 件 / 未取得 $($changes.DistributionUrlUnresolvedEntryCount) 件"
          Add-Content $env:GITHUB_STEP_SUMMARY "- 追加: $(@($changes.Added).Count) / 更新: $(@($changes.Updated).Count) / 削除: $(@($changes.Removed).Count)"
          if (@($changes.Added).Count -gt 0) {
            Write-Host "::notice title=AetherFeed summary::$(@($changes.Added).Count) 件の追加を検知しました"
          }
        shell: pwsh

      - name: Deploy AetherFeed summary
        run: |
          Copy-Item "dist/${{ env.DISCOVERY_FILE }}" "${{ env.DISCOVERY_FILE }}" -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${{ env.DISCOVERY_FILE }}"
          if (git diff --cached --quiet) {
            Write-Host "AetherFeed まとめに変更はありません。"
          } else {
            git commit -m "Update AetherFeed summary"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "AetherFeed まとめの push に失敗しました" }
          }
        shell: pwsh

  continue:
    name: Restart AetherFeed summary after approximately 6 hours
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Wait after completion (PowerShell)
        env:
          REQUESTED_WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          # GitHub-hosted jobsは最大6時間のため、処理時間分の余裕を残す。
          $waitSeconds = 21400
          if ($env:REQUESTED_WAIT_SECONDS -match '^\d+$' -and [int]$env:REQUESTED_WAIT_SECONDS -gt 0) {
            $waitSeconds = [int]$env:REQUESTED_WAIT_SECONDS
          }
          Write-Host "次回のAetherFeed Summaryまで $waitSeconds 秒待機します。"
          Start-Sleep -Seconds $waitSeconds
        shell: pwsh

      - name: Dispatch next AetherFeed summary run (PowerShell)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{ ref = 'main' } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-aetherfeed-summary.yml/dispatches" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body
        shell: pwsh
